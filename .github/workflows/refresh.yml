name: Refresh reviews and publish

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull new reviews that name Killian
        if: github.event_name != 'push'
        run: python3 tools/refresh.py

      - name: Save new reviews
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "New reviews"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            # GitHub pauses scheduled jobs after 60 quiet days; a monthly empty commit keeps it running.
            git commit --allow-empty -m "Keep the schedule running"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
